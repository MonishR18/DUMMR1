services:
  db:
    image: postgres:15-alpine
    container_name: dummr-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dummr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dummr_password}
      POSTGRES_DB: ${POSTGRES_DB:-dummr_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dummr_user} -d ${POSTGRES_DB:-dummr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dummr-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dummr-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-dummr_user}:${POSTGRES_PASSWORD:-dummr_password}@db:5432/${POSTGRES_DB:-dummr_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey12345supersecretkey12345}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkey12345supersecretkey12345}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - api_uploads:/app/uploads

  frontend:
    build:
      context: ./DUMMR_Services
      dockerfile: Dockerfile
    container_name: dummr-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  api_uploads:
