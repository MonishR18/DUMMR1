name: DUMMR Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dummr_user
          POSTGRES_PASSWORD: dummr_password
          POSTGRES_DB: dummr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg2://dummr_user:dummr_password@localhost:5432/dummr_db
        run: |
          alembic upgrade head

      - name: Run Pytest test suite
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg2://dummr_user:dummr_password@localhost:5432/dummr_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: testsecretkey12345testsecretkey12345
          JWT_SECRET_KEY: testsecretkey12345testsecretkey12345
          ENVIRONMENT: test
        run: |
          pytest -v
